<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makiglalis Ka?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9ec4,#ffd6e7);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.container{
    background:#fff;
    width:90%;
    max-width:420px;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    color:#ff4f81;
    margin-bottom:15px;
}

p{
    color:#444;
    font-size:18px;
    margin-bottom:35px;
    line-height:1.6;
}

.buttons{
    position:relative;
    height:120px;
}

button{
    border:none;
    padding:15px 35px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

#yes{
    background:#ff4f81;
    color:white;
    margin-right:15px;
}

#yes:hover{
    transform:scale(1.08);
}

#no{
    background:#666;
    color:white;
    position:absolute;
}

#result{
    display:none;
}

.big{
    font-size:45px;
}

h2{
    color:#ff4f81;
    margin:20px 0;
}

</style>
</head>

<body>

<div class="container" id="home">

<h1>Makiglalis ka? 😒</h1>

<p>
Dili ka kahibaw mo-comfort sa uyab nimo?<br>
Mo duol ra baya kag makiglalis. 😤
</p>

<div class="buttons">

<button id="yes">💗 Yes</button>

<button id="no">🙈 No</button>

</div>

</div>

<div class="container" id="result">

<div class="big">😡</div>

<h2>Yey!</h2>

<p>

<strong>Thank you, nakuha na sad nimo akong kalagot! 😡</strong>

<br><br>

Pasagpaa gud kos nawng, tiyo. 🤦‍♀️😂

<br><br>

❤️ <strong>Bati na ta?</strong>

</p>

</div>

<script>

const no=document.getElementById("no");

no.addEventListener("mouseover",()=>{

let x=Math.random()*(window.innerWidth-120);

let y=Math.random()*(window.innerHeight-70);

no.style.left=x+"px";
no.style.top=y+"px";

});

document.getElementById("yes").onclick=function(){

document.getElementById("home").style.display="none";

document.getElementById("result").style.display="block";

}

</script>

</body>
</html>
